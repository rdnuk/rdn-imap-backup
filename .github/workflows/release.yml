name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '22.22.2'
      JSBIN_DIR: /tmp/js2bin
      APP_DIR: dist/bundle.js
      APP_PREFIX: imap-backup

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Create tag from package.json version (manual runs only)
        id: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="v$VERSION"
          echo "Detected version: $VERSION"
          echo "Tag to create: $TAG"
          git fetch --tags origin
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists. Skipping tag creation."
          else
            git config user.name "github-actions"
            git config user.email "github-actions@github.com"
            git tag "$TAG"
            git push origin "$TAG"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
        shell: bash

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --with=dev

      - name: Bundle app with webpack
        run: npm run build

      - name: Build linux-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=linux --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build linux-arm64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=linux --arch=arm64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build darwin-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=darwin --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build darwin-arm64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=darwin --arch=arm64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build windows-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=windows --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB
      
      - name: Copy Windows binary to .exe for release
        run: |
          if [ -f "$JSBIN_DIR/$APP_PREFIX-windows-x64" ]; then
            cp "$JSBIN_DIR/$APP_PREFIX-windows-x64" "./$APP_PREFIX-windows-x64.exe"
          elif [ -f "./$APP_PREFIX-windows-x64" ]; then
            cp "./$APP_PREFIX-windows-x64" "./$APP_PREFIX-windows-x64.exe"
          else
            echo "Warning: Windows binary not found to copy."
          fi
        shell: bash

      - name: List built binaries
        run: ls -lh

      - name: Prepare binaries
        run: |
          chmod +x ./imap-backup-linux-x64 
          chmod +x ./imap-backup-linux-arm64 
          chmod +x ./imap-backup-darwin-x64 
          chmod +x ./imap-backup-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            ./imap-backup-linux-x64
            ./imap-backup-linux-arm64
            ./imap-backup-darwin-x64
            ./imap-backup-darwin-arm64
            ./imap-backup-windows-x64.exe

