name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    env:
      NODE_VERSION: '22.22.2'
      JSBIN_DIR: /tmp/js2bin
      APP_DIR: dist/bundle.js
      APP_PREFIX: imap-backup

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install --with=dev

      - name: Bundle app with webpack
        run: npm run build

      - name: Build linux-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=linux --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build linux-arm64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=linux --arch=arm64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build darwin-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=darwin --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build darwin-arm64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=darwin --arch=arm64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB

      - name: Build windows-x64 binary
        run: npx js2bin --build --node=$NODE_VERSION --platform=windows --arch=x64 --app=$APP_DIR --name=$APP_PREFIX --dir=$JSBIN_DIR --size=6MB
      
      - name: List built binaries
        run: ls -lh $JSBIN_DIR

      - name: Prepare binaries
        run: |
          chmod +x $JSBIN_DIR/imap-backup-linux-x64 
          chmod +x $JSBIN_DIR/imap-backup-linux-arm64 
          chmod +x $JSBIN_DIR/imap-backup-darwin-x64 
          chmod +x $JSBIN_DIR/imap-backup-darwin-arm64

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            $JSBIN_DIR/imap-backup-linux-x64
            $JSBIN_DIR/imap-backup-linux-arm64
            $JSBIN_DIR/imap-backup-darwin-x64
            $JSBIN_DIR/imap-backup-darwin-arm64
            $JSBIN_DIR/imap-backup-windows-x64.exe

