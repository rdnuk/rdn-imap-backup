name: Build and Release Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Bundle app with webpack
        run: npm run build

      - name: Cache js2bin prebuilt binaries
        uses: actions/cache@v4
        with:
          path: ~/.js2bin
          key: js2bin-node-22.22.2

      - name: Build linux-x64 binary
        run: npx js2bin --build --node=22.22.2 --platform=linux --arch=x64 --app=dist/bundle.js --name=imap-backup --cache

      - name: Build linux-arm64 binary
        run: npx js2bin --build --node=22.22.2 --platform=linux --arch=arm64 --app=dist/bundle.js --name=imap-backup --cache

      - name: Build darwin-x64 binary
        run: npx js2bin --build --node=22.22.2 --platform=darwin --arch=x64 --app=dist/bundle.js --name=imap-backup --cache

      - name: Build darwin-arm64 binary
        run: npx js2bin --build --node=22.22.2 --platform=darwin --arch=arm64 --app=dist/bundle.js --name=imap-backup --cache

      - name: Build windows-x64 binary
        run: npx js2bin --build --node=22.22.2 --platform=win32 --arch=x64 --app=dist/bundle.js --name=imap-backup --cache

      - name: Prepare binaries
        run: |
          # Ensure Unix binaries are executable
          chmod +x imap-backup-linux-x64 imap-backup-linux-arm64 imap-backup-darwin-x64 imap-backup-darwin-arm64

      - name: List built binaries
        run: ls -lh imap-backup-*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            imap-backup-linux-x64
            imap-backup-linux-arm64
            imap-backup-darwin-x64
            imap-backup-darwin-arm64
            imap-backup-windows-x64.exe
