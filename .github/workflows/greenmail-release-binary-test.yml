name: GreenMail Latest Release Binary Smoke Test

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  latest-release-binary:
    strategy:
      matrix:
        platform:
          - os: ubuntu-latest
            asset: imap-backup-linux-x64
          - os: ubuntu-latest
            asset: imap-backup-linux-arm64
    runs-on: ${{ matrix.platform.os }}
    services:
      greenmail:
        image: greenmail/standalone:latest
        ports:
          - 3025:3025
          - 3143:3143
          - 8080:8080

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'

      - name: Install dependencies
        run: npm install --with=dev

      - name: Run release binary GreenMail smoke test
        run: node scripts/greenmail-release-binary-test.js --asset-name "${{ matrix.platform.asset }}" --output "./latest-release-${{ matrix.platform.asset }}"
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USE_GREENMAIL_SERVICE: 'true'
          USE_DOCKER: ${{ matrix.platform.useDocker }}
